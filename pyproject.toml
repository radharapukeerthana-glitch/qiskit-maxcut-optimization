[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-o1-maxcut-benchmark"
version = "0.1.0"
description = "Architecture-aware QAOA Max-Cut prototype for Qiskit Fall Fest 2026"
requires-python = ">=3.11"
dependencies = [
  "qiskit>=1.2,<3.0",
  "qiskit-aer>=0.15",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]
[tool.setuptools.packages.find]
where = ["src"]
